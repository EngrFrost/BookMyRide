<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0a0a14" />
    <title>Offline — Bookmyride</title>
    <style>
      * { box-sizing: border-box; margin: 0; }
      body {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 2rem;
        font-family: system-ui, sans-serif;
        background: #0a0a14;
        color: #e8e6f0;
      }
      .card {
        max-width: 24rem;
        text-align: center;
        padding: 2rem;
        border-radius: 1rem;
        border: 1px solid rgba(255, 255, 255, 0.12);
        background: rgba(255, 255, 255, 0.06);
      }
      h1 { font-size: 1.5rem; margin-bottom: 0.75rem; color: #f2b765; }
      p { color: #a8a3b8; line-height: 1.5; margin-bottom: 1.5rem; }
      button {
        padding: 0.75rem 1.5rem;
        border: none;
        border-radius: 9999px;
        font-weight: 600;
        cursor: pointer;
        background: linear-gradient(135deg, #f2b765, #e8942d);
        color: #1a1208;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>You're offline</h1>
      <p>Bookmyride needs a network connection. Cached pages may still work — try again when you're back online.</p>
      <button type="button" onclick="location.reload()">Retry</button>
    </div>
  </body>
</html>
